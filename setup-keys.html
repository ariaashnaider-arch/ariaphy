<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>کلیدهای Aria Wasmer</title>
  <link rel="stylesheet" href="static/style.css">
  <script defer src="static/keys.js"></script>
</head>
<body>
  <main class="shell">
    <section class="card narrow" data-keygen>
      <h1>کلیدهای راه‌اندازی Aria</h1>
      <p>این صفحه بدون اینترنت رمز و کلید را روی دستگاه خودت می‌سازد.</p>
      <button type="button" data-generate>تولید رمز و کلید</button>
      <div data-values hidden>
        <label><code dir="ltr">ARIA_ADMIN_PASSWORD</code><input data-password dir="ltr" readonly></label>
        <label><code dir="ltr">ARIA_SIGNING_KEY</code><input data-signing-key dir="ltr" readonly></label>
        <p>هر مقدار را کامل در Environment variables اپ Wasmer کپی کن.</p>
      </div>
    </section>
  </main>
</body>
</html>
